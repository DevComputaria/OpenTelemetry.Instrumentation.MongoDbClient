name: OSSF Scorecard

on:
  push:
    branches:
      - main
  schedule:
    - cron: "24 5 * * 0"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  analysis:
    name: Scorecard analysis
    if: github.event_name != 'schedule' || (github.event_name == 'schedule' && github.event.repository.fork == false)
    runs-on: ubuntu-24.04
    permissions:
      checks: read
      contents: read
      id-token: write
      issues: read
      pull-requests: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: 'tree:0'
          persist-credentials: false
          show-progress: false

      - name: Run Scorecard analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        id: scorecard
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Write SARIF summary to Action output
        shell: bash
        run: |
          {
            echo "## OSSF Scorecard Results"
            echo ""
            echo '```'
            echo "Tool: $(jq -r '.runs[0].tool.driver.name // "N/A"' results.sarif)"
            echo "Version: $(jq -r '.runs[0].tool.driver.semanticVersion // "N/A"' results.sarif)"
            echo ""
            echo "Total checks: $(jq '.runs[0].results | length' results.sarif)"
            echo ""
            printf "%-30s %-8s %s\n" "Check" "Score" "Reason"
            printf "%-30s %-8s %s\n" "-----" "-----" "------"
            jq -r '.runs[0].results[] | [
              .ruleId,
              (try (.properties.score | tostring + "/10") catch "N/A"),
              (.message.text | split("\n")[0])
            ] | @tsv' results.sarif | while IFS=$'\t' read -r check score reason; do
              printf "%-30s %-8s %s\n" "$check" "$score" "$reason"
            done
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload code scanning results
        uses: github/codeql-action/upload-sarif@7188fc363630916702deb7c1fdcf4e481b751f97a # v4.37.1
        with:
          sarif_file: results.sarif
