name: Package Validation

on:
  workflow_call:

permissions:
  contents: read

jobs:
  run-package-validation-stable:
    name: Validate packages (stable)
    runs-on: windows-2025

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false
        show-progress: false

    - name: Get Git commit timestamp
      id: get-commit-timestamp
      shell: pwsh
      run: |
        "epoch=$(git log -1 --pretty=%ct)" >> ${env:GITHUB_OUTPUT}

    - name: Setup .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        dotnet-version: |
          6.0.x
          8.0.x

    - name: dotnet build
      run: dotnet build ./src/OpenTelemetry.Instrumentation.MongoDbClient --configuration Release

    - name: dotnet pack
      run: dotnet pack ./src/OpenTelemetry.Instrumentation.MongoDbClient --configuration Release --no-build /p:EnablePackageValidation=true /p:ExposeExperimentalFeatures=false /p:RunningDotNetPack=true
      env:
        SOURCE_DATE_EPOCH: ${{ steps.get-commit-timestamp.outputs.epoch }}

    - name: Publish stable NuGet packages to Artifacts
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: packages-stable
        path: ./artifacts/package/release
        if-no-files-found: error

  run-package-validation-experimental:
    name: Validate packages (experimental)
    runs-on: windows-2025

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false
        show-progress: false

    - name: Get Git commit timestamp
      id: get-commit-timestamp
      shell: pwsh
      run: |
        "epoch=$(git log -1 --pretty=%ct)" >> ${env:GITHUB_OUTPUT}

    - name: Setup .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        dotnet-version: |
          6.0.x
          8.0.x

    - name: dotnet build
      run: dotnet build ./src/OpenTelemetry.Instrumentation.MongoDbClient --configuration Release

    - name: dotnet pack
      run: dotnet pack ./src/OpenTelemetry.Instrumentation.MongoDbClient --configuration Release --no-build /p:EnablePackageValidation=true /p:ExposeExperimentalFeatures=true /p:RunningDotNetPack=true
      env:
        SOURCE_DATE_EPOCH: ${{ steps.get-commit-timestamp.outputs.epoch }}

    - name: Publish experimental NuGet packages to Artifacts
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: packages-experimental
        path: ./artifacts/package/release
        if-no-files-found: error
